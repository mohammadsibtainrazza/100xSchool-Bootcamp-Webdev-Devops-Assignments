<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Sales</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>  
    <div class="contactpage">
    <div class="left">
    <div class="title"><h2>IIElevenLabs</h2></div>
    <div class="left-details">
        <h1>Contact our sales team</h1>
        <h3 class="ep">Custom pricing and elevated concurrency</h3>
        <h3 class="ep">Enterprise-grade security including SOC II,GDPR and HIPAA comppliance</h3>
        <h3 class="ep">Enterprise support and SLAs</h3>
    </div>
    </div>
    <div class="right">
        <div class="right-details">
        <h1>Contact sales form</h1>
        <h3 class="lcaption">Please fill out the form below to get started</h3>
        <h3 class="epl">Company Website</h3>
            <input type="text" name="website" id="website" placeholder="elevenlabs.io">
        <h3 class="epl">Business Email</h3>
            <input type="email" name="website" id="email" placeholder="example@elevenlabs.io">
        <input type="button" value="Next" id="nextbtn">    
        </div>
    </div>
    </div>
</body>
</html>
